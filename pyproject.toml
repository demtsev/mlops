[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-lineage"
version = "1.0.0"
description = "Production-quality MLOps repository with Git, DVC (Azure Blob), and MLflow (Azure ML) integration"
authors = [{name = "MLOps Team"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dvc[azure]==3.48.0",
    "mlflow==2.10.2",
    "azureml-mlflow==1.56.0",
    "azure-ai-ml==1.14.0",
    "azure-identity==1.15.0",
    "python-dotenv==1.0.1",
    "scikit-learn==1.4.0",
    "pandas==2.2.0",
    "rich==13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools]
packages = ["mlops_lineage"]
package-dir = {"" = "src"}
